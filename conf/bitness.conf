training:
  iterations_from: 1
  iterations_to: 1
  epochs: 100
  batch_size: 256
  rmse_threshold: 0.05
  samples_per_model: 4096
  samples_per_case: 128
  bitness_from: 6
  bitness_to: 6
  seed: 239
  model_dir: /tmp/circus

model:
  name: deepset
  phi_hidden: 512
  phi_out: 256
  rho_hidden: 512
  dropout: 0.3

optimizer:
  name: adam
  lr: 0.001
  scheduler:
    name: reduce_lr_on_plateau
    patience: 5
    factor: 0.5
