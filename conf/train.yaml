# One training run trains one model at one bitness: `M_1` or `M_2`, named
# together with the bitness on the command line of
# `scripts/train/train_model.sh`. What is here is everything that run needs
# beyond those two.

data_dir: data          # the offline files are read here; final best model copied there
work_dir: /tmp/circus   # everything a run writes: the epoch's weights, the best epoch's, the metrics
seed: 239               # daemon sampling and PyTorch initialization/shuffling

sampling:               # how the daemon expands one entry into one case
  batches: 8            # independent samplings of the input space per case
  points_in_batch: 128  # points expanded out of each sampling; a power of two greater than one

training:
  epochs: 1024           # passes over the whole training file; the only duration knob
  batch_size: 256
  rmse_threshold: 0.05  # stops the run early once a training epoch reaches it

model:
  phi_hidden: 256       # phi reads the raw points of one batch
  phi_out: 128
  psi_hidden: 64       # psi reads one input bit's pooled statistics
  psi_out: 64
  rho_hidden: 256
  rho_out: 128
  dropout: 0.1

optimizer:
  lr: 0.001
  scheduler:
    patience: 20
    factor: 0.5
    min_lr: 0.0001      # keep updating weights when validation stalls
